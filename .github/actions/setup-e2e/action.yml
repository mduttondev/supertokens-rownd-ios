name: Prepare E2E downloads and Docker
description: Cache pinned tools and start Docker on Intel macOS before the workflow prefetches E2E images
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      id: tools
      with:
        path: |
          ${{ runner.temp }}/ios-docker-tools/downloads/lima.tar.gz
          ${{ runner.temp }}/ios-docker-tools/downloads/colima
          ${{ runner.temp }}/ios-docker-tools/downloads/docker.tgz
        key: docker-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/setup-docker-macos.sh') }}
    - name: Start Docker
      shell: bash
      run: bash .github/scripts/setup-docker-macos.sh
    - uses: actions/cache/save@v4
      if: steps.tools.outputs.cache-hit != 'true'
      with:
        path: |
          ${{ runner.temp }}/ios-docker-tools/downloads/lima.tar.gz
          ${{ runner.temp }}/ios-docker-tools/downloads/colima
          ${{ runner.temp }}/ios-docker-tools/downloads/docker.tgz
        key: ${{ steps.tools.outputs.cache-primary-key }}
