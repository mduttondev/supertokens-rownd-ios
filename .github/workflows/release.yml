name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: Skip E2E tests for this release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Swift dependencies
        uses: ./.github/actions/cache-swift
        with:
          workspace: RowndPackage.xcworkspace
          scheme: Rownd

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Run package and unit tests
        run: npm run test:version && npm run test:package && npm run test:example:unit

  cocoapods:
    name: CocoaPods
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Run CocoaPods consumer runtime test
        run: bash Tests/CocoaPodsRuntime/run.sh

  e2e:
    name: E2E
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.skip_e2e)
    runs-on: macos-15-intel
    # Keep the E2E step deadline below the job deadline so diagnostics can run.
    timeout-minutes: 75
    env:
      IOS_E2E_BACKEND_STARTUP_TIMEOUT_MS: '600000'
      # Image downloads have a separate prefetch budget; this bounds container readiness.
      IOS_E2E_CONTAINER_STARTUP_TIMEOUT_MS: '180000'
      DEBUG: testcontainers,testcontainers:pull
    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Hub
        uses: actions/checkout@v4.4.0
        with:
          repository: supertokens/supertokens-rownd-hub
          ref: 2146e7ad6f67473d7d5aadab2f94cc5373c5ff0b
          path: supertokens-rownd-hub
          token: ${{ secrets.ROWND_HUB_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker
        timeout-minutes: 10
        uses: ./.github/actions/setup-e2e

      - name: Prefetch E2E images
        # Cold pulls took ~8 minutes; keep downloads outside backend startup and simulator boot.
        timeout-minutes: 15
        run: bash .github/scripts/prefetch-e2e-images.sh

      - name: Install iOS SDK dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install Hub dependencies
        # A cold install on the Intel runner completed its npm summary after 4m10s.
        timeout-minutes: 8
        run: npm ci --prefix supertokens-rownd-hub

      - name: Resolve Swift dependencies
        timeout-minutes: 10
        uses: ./.github/actions/cache-swift

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Run E2E tests
        timeout-minutes: 50
        env:
          IOS_E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/ios-e2e-diagnostics
          IOS_E2E_UI_RESULTS_DIR: ${{ runner.temp }}/ios-e2e-ui-results
          IOS_LOCAL_HUB_REPO: ${{ github.workspace }}/supertokens-rownd-hub
        run: |
          node --import tsx --test test-server/diagnostics.test.ts test-server/ui-command.test.ts test-server/simulator-destination.test.ts test-server/serial-task-queue.test.ts test-server/startup.test.ts
          npm run test:e2e

      - name: Collect E2E failure resources
        if: ${{ !success() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          IOS_E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/ios-e2e-diagnostics
        run: node --import tsx test-server/resource-diagnostics.ts

      - name: Retain bounded E2E diagnostics
        if: ${{ !success() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain UI XCTest results and attachments
        if: ${{ !success() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-e2e-ui-results/**/*.xcresult/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  release:
    name: Release
    needs: [test, cocoapods, e2e]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.cocoapods.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release history
        run: |
          current_tag="v$(tr -d '[:space:]' < VERSION)"
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -1)"

          if [[ "$current_tag" != "$latest_tag" ]]; then
            echo "VERSION points to $current_tag, but the latest tag is $latest_tag"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo "$latest_tag is not part of the main branch history"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure CocoaPods credentials
        env:
          COCOAPODS_TRUNK_USERNAME: ${{ secrets.COCOAPODS_TRUNK_USERNAME }}
          COCOAPODS_TRUNK_PASSWORD: ${{ secrets.COCOAPODS_TRUNK_PASSWORD }}
        run: |
          : "${COCOAPODS_TRUNK_USERNAME:?COCOAPODS_TRUNK_USERNAME secret is not configured}"
          : "${COCOAPODS_TRUNK_PASSWORD:?COCOAPODS_TRUNK_PASSWORD secret is not configured}"

          umask 077
          printf 'machine trunk.cocoapods.org\n  login %s\n  password %s\n' \
            "$COCOAPODS_TRUNK_USERNAME" \
            "$COCOAPODS_TRUNK_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci

      - name: Remove CocoaPods credentials
        if: always()
        run: rm -f "$HOME/.netrc"
