name: Native email verification compatibility

on:
  workflow_dispatch:
    inputs:
      hub_ref:
        description: Pushed Hub branch, tag, or commit
        required: true
        type: string
      plugin_version:
        description: Published @supertokens-plugins/rownd-nodejs version
        required: true
        default: 0.6.13
        type: string
      core_image:
        description: SuperTokens Core container image, including tag or digest
        required: true
        default: supertokens/supertokens-postgresql:12.0.10
        type: string

permissions:
  contents: read

concurrency:
  group: native-email-verification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate selected versions
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      E2E_CORE_IMAGE: ${{ inputs.core_image }}
      IOS_E2E_BACKEND_STARTUP_TIMEOUT_MS: '600000'
      # Image downloads have a separate prefetch budget; this bounds container readiness.
      IOS_E2E_CONTAINER_STARTUP_TIMEOUT_MS: '180000'
      DEBUG: testcontainers,testcontainers:pull

    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout Hub
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: supertokens/supertokens-rownd-hub
          ref: ${{ inputs.hub_ref }}
          path: supertokens-rownd-hub
          token: ${{ secrets.ROWND_HUB_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker
        timeout-minutes: 10
        uses: ./.github/actions/setup-e2e

      - name: Prefetch E2E images
        # Cold pulls took ~8 minutes; keep downloads outside backend startup and simulator boot.
        timeout-minutes: 15
        run: bash .github/scripts/prefetch-e2e-images.sh

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix supertokens-rownd-hub

      - name: Select released plugin
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: npm install --no-save --package-lock=false "@supertokens-plugins/rownd-nodejs@$PLUGIN_VERSION"

      - name: Resolve Swift dependencies
        timeout-minutes: 10
        uses: ./.github/actions/cache-swift

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Run stale-authentication ordering and Safari handoff tests
        env:
          IOS_E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/ios-e2e-diagnostics
          IOS_E2E_UI_RESULTS_DIR: ${{ runner.temp }}/ios-e2e-ui-results
          IOS_E2E_ONLY_UI: 1
          IOS_E2E_UI_SCRIPT: test:e2e:ui:native-email-verification
          IOS_LOCAL_HUB_REPO: ${{ github.workspace }}/supertokens-rownd-hub
        run: npm run test:e2e

      - name: Retain UI XCTest results and attachments
        if: ${{ !success() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-e2e-ui-results/**/*.xcresult/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain bounded E2E diagnostics
        if: ${{ !success() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
