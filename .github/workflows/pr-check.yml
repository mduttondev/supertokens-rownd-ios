name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Cache Swift dependencies
        uses: ./.github/actions/cache-swift
        with:
          workspace: RowndPackage.xcworkspace
          scheme: Rownd

      - name: Run package tests
        run: xcodebuild -workspace RowndPackage.xcworkspace -scheme Rownd -destination "$IOS_SIMULATOR_DESTINATION" -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm" -skip-testing:RowndIntegrationTests -parallel-testing-enabled NO test

      - name: Run example configuration test
        run: xcodebuild -workspace rownd.xcworkspace -scheme rownd_ios_example -destination "$IOS_SIMULATOR_DESTINATION" -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm" -only-testing:rownd_ios_exampleTests/RowndExampleTests/testSuperTokensConfigDefaultsToAuthBasePath test

  cocoapods:
    name: CocoaPods
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout iOS SDK
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: 26.0.1

      - name: Prepare iOS simulator
        timeout-minutes: 10
        run: bash .github/scripts/setup-ios-simulator.sh

      - name: Run CocoaPods consumer runtime test
        run: bash Tests/CocoaPodsRuntime/run.sh

  test:
    name: Test
    needs: [package, cocoapods]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          COCOAPODS_RESULT: ${{ needs.cocoapods.result }}
        run: test "$PACKAGE_RESULT" = success && test "$COCOAPODS_RESULT" = success
